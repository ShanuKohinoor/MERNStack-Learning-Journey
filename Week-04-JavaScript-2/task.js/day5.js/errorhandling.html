    <!--//Error handling
     //Error handling is the process of understanding and managing errors in a program, so it doesn't crash.
     // It is done using tools like try...catch, finally, throw, and .catch() for Promises.

 -->



<script>

  //Eg: 
  // Normal code without error:-

        let name = "Shanu";
        console.log("Hello" + name) //Output:- Hello Shanu

  // Normal code  with error:-

        //let name1 = "Shanu";
        //console.log("Hello" + fullname) //Output:- Reference error. Because here fullname is not defined.
 

  // To overcome(handle) this error,use 'try...catch, finally, throw, and .catch() for Promises'.

    //Throw:-
        // Use throw when we want to create our own error manually.

        //It stops the code and sends the error message you provide.

        //Then you can catch that error in a catch block.
        // finally runs at the end always.

             throw new Error("fullname is not defined — custom error!");
