                              <!--DEBOUNCE
                              
q.1 You have a button on a webpage. When the user clicks the button, you want to log "Button clicked!", but only if the user stops clicking for at least 2 seconds.

        Write a JavaScript function to implement this behavior using debounce.

               
                              
                              -->

    <button type="button"  id="myBtn">CLICKED</button>


    <script>

  function clicks(){
    console.log("Button Clicked")
  }

function debounce(fctn,delay) {
    let Timer;

    return function(){
        clearTimeout(Timer);
        Timer = setTimeout(fctn,delay)
    }
    
}




        const btn = document.getElementById("myBtn")
        const debounced = debounce(clicks,2000)
        btn.addEventListener('click',debounced)

        

    </script>



<!--Q2. You have a search input box on a webpage. When the user types in the search box, you want to call a function searchQuery that fetches search results, but only if the user stops typing for at least 2 seconds. Write a JavaScript function using debounce to implement this behavior.-->

<input type="text" placeholder=" search" id="search">


<script>
    function searchQuery(){
        console.log("search completed")
    }

    function debounce1(fctn,delay){
        let Timer;
        return function() {
            clearTimeout(Timer);
            Timer = setTimeout(fctn,delay);
            
        }
    }
    const txt = document.getElementById("search")
    const debounced1 = debounce1(searchQuery,2000)
    txt.addEventListener("input",debounced1)
</script>
