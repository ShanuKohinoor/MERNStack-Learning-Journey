<!--Tricky questions
  

Q 1. What is the difference between event bubbling and event capturing? Which one is the default in JavaScript event handling?
  Answer:- Event Capturing:-When an event happens, event starts from the window and goes down to the DOM tree to the target element.
           Event Bubbling:- In this event starts from the target and goes up to the parent(its ancestor)

         In Javascript Event Bubbling is default.


Q 2.Given the following code, what will be the order of console logs if you click on the <span> element?
   
    1. Without third argument-->
    <div id="outer" style="width: 200px; background-color:gray;">
        <button id="inner"  style="width: 100; background-color: rgb(3, 78, 78);">
            <span id="label">Click me</span>
        </button>
    </div>
<script>
    const outer1 = document.getElementById('outer');
    const inner1 = document.getElementById('inner');
    const label = document.getElementById('label');

    outer1.addEventListener(("click"),()=>console.log('outer1'))
    inner1.addEventListener(("click"),()=>console.log('inner'))
    label.addEventListener(("click"),()=>console.log('label'))

    // When click on <span>, Output will be
            //label
            //inner
            //outer1
                  //Explanation:- When i click on label(<span>),-> event bubbles upto inner->then to outer1

    // When click on button, Output is
           //inner 
           // outer1
                  //Explanation:- When i click on button,->event bubbles upto outer

    // When click on outer, Output is
          // outer1

</script>

//Q.4
document.body.addEventListener("click", (e) => {
  e.stopPropagation(); // stop bubbling & capturing
  alert("Blocked!");
}, true); // capturing

// Stops event from going down or bubbling up.	This will run before  other element  sees the event.


//Q.5
document.body.addEventListener("click", (e) => {
  e.stopPropagation(); // stop bubbling & capturing
  alert("Blocked!");
}, false); // Bubbling

// Stops event from going up. This will run before  other element  sees the event.
