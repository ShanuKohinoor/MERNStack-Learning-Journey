            <!--tricky questions

            
            1. Question:
               If you add an event listener to a parent element and inside it is a child element, will event.target ever be equal to the parent element when you click the child?

                   Answer:
                     No.Because, When we click the child, event.target is the child element (the actual clicked element), not the parent. 
                     The parent can be accessed through event.currentTarget only.

            2.Question:
               If you click on a <span> inside a <button>, and the click event is attached to the <button>, what is event.target?

                    Answer:
                      event.target is the <span> — because that is the deepest element that was actually clicked.
                      Even though the listener is on the <button>, event.target is always the real clicked element.


            3.Question:
              Can event.target ever be equal to event.currentTarget?

                    Answer:
                     Yes — if you click directly on the element that has the event listener, then event.target === event.currentTarget.-->

<!--event.currentTarget:-The element that has event listener-->

               <div id="outer" style="width: 200px; height: 50px; background-color: red; display: flex; justify-content: center;">
                    <button id="inner" style="height: 50px;  width: 50px;">Click Me</button>
               </div>


            <script>
                const outer = document.getElementById('outer')
                
                outer.addEventListener('click', function(event) {
                console.log("target:", event.target.id);               //target: inner
                console.log("currentTarget:", event.currentTarget.id); //currentTarget: outer
                });

                         // If click the empty space (not the button), then output will be:-
                                                 //target: outer
                                                 //currentTarget: outer



            </script>
