   DOM API's
          1. select Elements(by getElementById)-->
               <div id="box">Hello</div>

               <script>
                   const box = document.getElementById('box');
                   console.log(box);
               </script>

         <!--2. change content (by element.textContent)-->
               <div id="box1">Old Text</div>

               <script>
                const boxx = document.getElementById('box1');
                boxx.textContent = "New Text";               
               </script>


         <!--3. change style (by element.stle.color)-->

              <p id="text" style="color:blue">Color me!</p>

              <script>
                const p = document.getElementById('text');
                p.style.color = "red";
              </script>
        <!-- 4. create element(by document.creatElement)-->

             <script>
                const newDiv = document.createElement("div");  //should be a tag(here we create a div)
                newDiv.textContent = "I'm new here";
                document.body.appendChild(newDiv);   //document.body.appendchild means
                                                        //document is the global object representing the entire webpage.

                                                       //body is the <body> element of the page (where most visible content lives)

                                                       //appendChild() is a DOM API method that adds a node (element) as the last child inside another element.

                              //Append child:- adds a node to the end of the list of children of a specified parent node.
                                   //Syntax:-
                                       parentNode.appendChild(newChildNode);

       

 

             </script>

        <!-- 5. insert element(parent.appendChild(newDiv))-->
             <div id="container">Container</div>

             <script>
                const parent = document.getElementById('container');
                const child = document.createElement("p")  // here we are creating a paragraph. so use p to create <p>
                child.textContent = "I'm a child";
                parent.appendChild(child);     // Output :- Im a child
             </script>
        <!-- 6. Remove element( by elelment.remove)-->

            <button onclick="removeMe(this)">Remove me</button>
                    <!--Why do we use this in onclick="removeMe(this)"?
                               When you write onclick="removeMe(this)", the this refers to the element that triggered the event — in this case, the button that was clicked.So, this is the button element itself. Passing this means you give the function a direct reference to the element to remove.-->

            <script>
               function removeMe(button){
                button.remove();
               }
            </script>
        <!-- 7. Attach event(by addEventListener)-->

            <button id="btn">Click Me</button>

            <script>
                const btn1 = document.getElementById('btn');
                btn1.addEventListener("click",()=>
                 alert("Button clicked"));        // we can use 'window.alert' instead of 'alert' alone.
            </script>
